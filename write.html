<!doctype html>
<html lang="ko">
<head>

<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="/" class="logo">
        <span class="logo__en" aria-hidden="true">AI WORK STUDY LOG</span>
        <span class="logo__ko">AI 업무 학습 일지</span>
      </a>
      <button type="button" class="icon-btn nav-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-nav">☰</button>
      <nav id="site-nav" class="site-nav" aria-label="주 메뉴">
        <a href="/" data-path="/">글 목록</a>
        <a href="/about" data-path="/about">소개</a>
        <a href="/write" data-path="/write" data-admin-only hidden>글쓰기</a>
        <a href="/settings" data-path="/settings" data-admin-only hidden>설정</a>
        <div class="auth">
          <span id="auth-user" class="auth__user" hidden></span>
          <button type="button" id="auth-btn" class="btn btn--secondary btn--sm" hidden>로그인</button>
        </div>
      </nav>
    </div>
  </header>

  <div id="config-banner" class="config-banner" hidden>
    <p class="notice notice--warn">Firebase 설정이 필요합니다. js/config.js에 설정값을 넣으면 글을 불러오고 저장할 수 있습니다.</p>
  </div>

  <main id="main" class="page">
    <div id="message" class="message-area" aria-live="polite"></div>

    <div data-guard hidden>
      <div class="container container--read">
        <header id="page-head" class="page-head">
          <span class="eyebrow" aria-hidden="true">WRITE</span>
          <h1 class="h1">새 글 쓰기</h1>
        </header>
        <div id="form-root">
          <p class="loading">불러오는 중…</p>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div>
        <p class="logo__ko">AI 업무 학습 일지</p>

      </div>
      <nav class="site-footer__nav" aria-label="바닥 메뉴">
        <a href="/">글 목록</a>
        <a href="/about">소개</a>
